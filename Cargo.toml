[workspace]
members = [
    "crates/rssp-core",
    "crates/rssp",
    "crates/rssp-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.268"

[workspace.dependencies]
memchr = "2.8.3"
rssp = { path = "crates/rssp" }
rssp-core = { path = "crates/rssp-core"}

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
debug = true
